# GitHub Pages Configuration for Jekyll

# Set the theme (optional)
theme: null # Remove if you need a specific theme, like 'jekyll-theme-primer'

# Exclude unnecessary files & directories
exclude:
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - Gemfile
  - Gemfile.lock

# Enable GitHub Metadata Plugin
plugins:
  - jekyll-github-metadata

# Set source and destination paths (default behavior)
source: .
destination: ./_site

# Enable markdown processing
markdown: kramdown
highlighter: rouge

# Optional settings for SEO and base URL
baseurl: '' # Set this if your repo is not at root (e.g., '/my-project')
url: 'https://your-github-username.github.io'

# Keep Jekyll from auto-processing unnecessary assets
keep_files:
  - assets

# Enable optional Jekyll features
include:
  - _pages # If you use a `_pages` directory for additional site structure

